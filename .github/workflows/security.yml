name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-submission:
    name: Dependency submission
    # GitHub derives the dependency graph from Maven manifests by itself, but not from Gradle
    # builds: without this job the graph holds GitHub Actions only, which leaves Dependabot
    # alerts and the review below blind to every Java dependency. Only the default branch
    # submits, so a pull request cannot rewrite the graph it is reviewed against.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/dependency-submission@v6

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
      - uses: gradle/actions/setup-gradle@v6
      - name: Build for analysis
        run: ./gradlew compileJava compileTestJava
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
